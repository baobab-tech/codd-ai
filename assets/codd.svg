<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="t">
  <title id="t">CODD AI: a cod whose body is a bar chart</title>
  <defs>
    <clipPath id="body">
      <path d="M52 140 C92 62 250 50 356 112 L356 168 C250 230 92 218 52 140 Z"/>
    </clipPath>
  </defs>

  <!-- tail and dorsal fin -->
  <path d="M346 140 L446 76 Q424 140 446 204 Z" fill="#2C6E91" stroke="#1D2B33" stroke-width="8" stroke-linejoin="round"/>
  <path d="M180 76 Q228 22 286 84 Z" fill="#2C6E91" stroke="#1D2B33" stroke-width="8" stroke-linejoin="round"/>

  <!-- body: horizontal bars of different lengths -->
  <path d="M52 140 C92 62 250 50 356 112 L356 168 C250 230 92 218 52 140 Z" fill="#EEF3F6"/>
  <g clip-path="url(#body)">
    <rect x="214" y="66"  width="152" height="26" fill="#8FA35E"/>
    <rect x="158" y="96"  width="208" height="26" fill="#2C6E91"/>
    <rect x="134" y="126" width="232" height="26" fill="#D80621"/>
    <rect x="176" y="156" width="190" height="26" fill="#F2B134"/>
    <rect x="246" y="186" width="120" height="30" fill="#5FB3C9"/>
  </g>
  <path d="M52 140 C92 62 250 50 356 112 L356 168 C250 230 92 218 52 140 Z" fill="none" stroke="#1D2B33" stroke-width="8" stroke-linejoin="round"/>

  <!-- eye -->
  <circle cx="98" cy="128" r="14" fill="#FFFFFF" stroke="#1D2B33" stroke-width="6"/>
  <circle cx="94" cy="128" r="6" fill="#1D2B33"/>
</svg>
